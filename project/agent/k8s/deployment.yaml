apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: agent
  labels:
    app: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      serviceAccountName: agent
      # Without this, Kubernetes auto-injects a POSTGRES_PORT=tcp://<ip>:5432
      # env var for every Service in this namespace (Docker-links compat),
      # which collides with and overrides the explicit POSTGRES_PORT=5432
      # below - crashing pydantic-settings (int_parsing on "tcp://...").
      enableServiceLinks: false
      # Fault injection in this demo only targets worker nodes (see injector/).
      # Pin the agent to the control-plane so it can never become collateral
      # damage of the very node/pod faults it's supposed to remediate.
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: agent
          image: capstart/remediation-agent:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: PROMETHEUS_URL
              value: http://prometheus.monitoring.svc.cluster.local:9090
            - name: LOKI_URL
              value: http://loki.monitoring.svc.cluster.local:3100
            - name: AWS_REGION
              value: us-east-1
            - name: BEDROCK_MODEL_ID
              value: amazon.nova-lite-v1:0
            - name: BEDROCK_ENABLED
              value: "true"
            - name: KUBE_IN_CLUSTER
              value: "true"
            - name: POSTGRES_HOST
              value: postgres.agent.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: DIAGNOSIS_HISTORY_EXAMPLES
              value: "3"
            # Default OFF: remediation action always comes from the deterministic
            # allow-list, the LLM only authors the plan's narrative. See
            # app/graph/nodes/plan.py and app/config.py.
            - name: LLM_AUTHORS_ACTION
              value: "false"
            # Optional LangSmith tracing (see app/observability.py) - off by default.
            # To enable: set to "true" and add LANGSMITH_API_KEY=... to your .env
            # (it flows through the same aws-bedrock-credentials secret below).
            - name: LANGSMITH_ENABLED
              value: "false"
            - name: LANGSMITH_PROJECT
              value: capstart-remediation-agent
          envFrom:
            - secretRef:
                name: aws-bedrock-credentials
            - secretRef:
                name: postgres-credentials
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: agent
spec:
  type: NodePort
  selector:
    app: agent
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
