# Template only - DO NOT put real credentials in this file or commit real ones.
# scripts/deploy.ps1 (and `make agent-secret`) create the actual secret for you
# from a git-ignored .env file - see .env.example and instructions.md. That is
# equivalent to running:
#   kubectl create secret generic aws-bedrock-credentials -n agent --from-env-file=.env
apiVersion: v1
kind: Secret
metadata:
  name: aws-bedrock-credentials
  namespace: agent
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
